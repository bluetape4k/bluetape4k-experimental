name: Nightly

on:
  schedule:
    - cron: '0 19 * * *'  # 매일 UTC 19:00 (KST 04:00)
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  build:
    name: Build (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
      - name: Build (compile only)
        run: ./gradlew build -x test --parallel --continue
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  test:
    name: Test (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Run tests
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
        run: ./gradlew test --continue --max-workers=1
      - name: Generate Kover XML report
        if: always()
        run: ./gradlew koverXmlReport --continue --max-workers=1
        continue-on-error: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-all-modules
          path: '**/build/reports/kover/'
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test
    if: always()
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-all-modules
          path: coverage-artifacts/coverage-all-modules
        continue-on-error: true

      - name: Validate expected coverage artifacts
        shell: bash
        run: |
          set -euo pipefail

          expected_artifacts=(
            coverage-all-modules
          )

          missing_artifacts=()
          empty_artifacts=()

          for artifact in "${expected_artifacts[@]}"; do
            artifact_dir="coverage-artifacts/${artifact}"
            if [[ ! -d "${artifact_dir}" ]]; then
              missing_artifacts+=("${artifact}")
              continue
            fi

            if ! find "${artifact_dir}" -type f \( -name 'report.xml' -o -name 'reportJvm.xml' \) -print -quit | grep -q .; then
              empty_artifacts+=("${artifact}")
            fi
          done

          if (( ${#missing_artifacts[@]} > 0 || ${#empty_artifacts[@]} > 0 )); then
            echo "::error title=Coverage artifacts incomplete::Expected coverage artifacts are missing or empty."

            if (( ${#missing_artifacts[@]} > 0 )); then
              printf 'Missing artifacts:\n'
              printf '  - %s\n' "${missing_artifacts[@]}"
            fi

            if (( ${#empty_artifacts[@]} > 0 )); then
              printf 'Empty artifacts:\n'
              printf '  - %s\n' "${empty_artifacts[@]}"
            fi

            echo "Downloaded artifacts:"
            find coverage-artifacts -maxdepth 2 -type d -print 2>/dev/null | sort || true
            exit 1
          fi

          printf 'Validated %s expected coverage artifacts.\n' "${#expected_artifacts[@]}"

      - name: Aggregate Kover coverage summary
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 30

  nightly-status:
    name: Nightly Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build
      - test
      - coverage-report
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Nightly results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "Nightly failed"
            exit 1
          fi
          echo "Nightly passed"
